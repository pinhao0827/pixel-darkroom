<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="給修圖初學者的互動筆記。">
  <meta name="theme-color" content="#f8f7f3">
  <title>修圖練習室｜影像練習筆記</title>
  <link rel="stylesheet" href="./assets/style.css">
  <script defer src="./assets/app.js"></script>
</head>
<body>
  <a class="skip" href="#main">跳到主要內容</a>
  <header class="site-header"><div class="wrap bar">
    <a class="brand" href="./index.html"><span class="brand-mark" aria-hidden="true"></span>修圖練習室</a>
    <a class="muted header-link" href="./index.html#notes">筆記目錄</a>
  </div></header>
  <main id="main" class="wrap">
    <section class="hero">
      <div class="hero-copy">
        <h1>修圖練習室</h1>
        <p class="description">選一篇筆記，動手調亮度、對比或飽和度。用兩張照片試試看，同樣的數值會帶來什麼變化。</p>
        <a class="primary" href="#notes">開始練習 <span aria-hidden="true">↓</span></a>
      </div>
      <div class="hero-photos">
        <figure>
    <img src="./assets/rainy-alley.jpg" alt="下雨的夜晚，紅燈籠和店裡的燈光倒映在小街的路面上。" width="1536" height="1024">
    <figcaption><span>雨中的紅燈籠</span><span>AI 生成</span></figcaption>
  </figure><figure>
    <img src="./assets/sunny-fruit-stall.jpg" alt="陽光照在柳橙和火龍果上，葉子的影子落在藍綠色木窗上。" width="1536" height="1024">
    <figcaption><span>陽光下的水果攤</span><span>AI 生成</span></figcaption>
  </figure>
      </div>
    </section>
    <section id="notes" class="catalog" aria-labelledby="catalog-title">
      <div class="catalog-head">
        <div class="catalog-title">
          <h2 id="catalog-title">練習筆記</h2>
          <p id="result-count" aria-live="polite">3 篇筆記</p>
        </div>
        <div class="filters" role="group" aria-label="筆記分類">
          <button type="button" data-category-filter="" aria-pressed="true">全部</button>
          <button type="button" data-category-filter="光線" aria-pressed="false">光線</button><button type="button" data-category-filter="色彩" aria-pressed="false">色彩</button>
        </div>
      </div>
      <div class="card-grid">
        <article class="card" data-category="光線">
          <h3><a href="./notes/brightness/index.html">亮度<span aria-hidden="true">↗</span></a></h3>
          <p class="eyebrow">Brightness <span> / </span> 光線</p>
          <p class="description">讓整張影像變亮或變暗，觀察陰影與高光一起變化時，哪些細節先消失。</p>
        </article><article class="card" data-category="光線">
          <h3><a href="./notes/contrast/index.html">對比<span aria-hidden="true">↗</span></a></h3>
          <p class="eyebrow">Contrast <span> / </span> 光線</p>
          <p class="description">放大或縮小明暗差距，找出讓畫面有層次的對比範圍。</p>
        </article><article class="card" data-category="色彩">
          <h3><a href="./notes/color-saturation/index.html">飽和度<span aria-hidden="true">↗</span></a></h3>
          <p class="eyebrow">Saturation <span> / </span> 色彩</p>
          <p class="description">從灰階到濃烈色彩，觀察紅燈籠與藍灰牆面如何改變。</p>
        </article>
      </div>
    </section></main>
  <footer class="site-footer"><div class="wrap bar"><span>修圖練習室</span><a class="header-link" href="./index.html#notes">瀏覽筆記</a></div></footer>
</body>
</html>
